[tool.poetry]
name = "embedding-service"
version = "0.1.0"
description = "Text Embedding Service using heydariAI/persian-embeddings"
authors = ["masoud89 <m.lakestani89@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
sentence-transformers = "^5.2.0"
fastapi = "^0.115.0"
pydantic = "^2.0.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
